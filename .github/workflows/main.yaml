name: 'Main'
on:
  - push

jobs:
  configure:
    runs-on: zondax-runners
    outputs:
      uid_gid: ${{ steps.get-user.outputs.uid_gid }}
      datetime: ${{ steps.get-datetime.outputs.datetime }}
    steps:
      - id: get-user
        run: echo "uid_gid=$(id -u):$(id -g)" >> $GITHUB_OUTPUT
      - id: get-datetime
        run: echo "datetime=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

  build:
    needs: [configure]
    runs-on: zondax-runners
    container:
      image: node:20-bookworm
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install node
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          scope: '@zondax'

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run format:check

      - run: bun lint

      # `prepare` builds with tsconfig.build.json, which leaves the tests out of the
      # program, and `bun test` strips types without checking them. Nothing else here
      # would catch a type error in a test file.
      - run: bun run typecheck

      - run: bun test
